name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: |
          mkdir -p app/src/main/java/com/editx/ai app/src/main/res/drawable
          cp MainActivity.kt app/src/main/java/com/editx/ai/
          cp AndroidManifest.xml app/src/main/
          cp logo.png app/src/main/res/drawable/logo.png
          cp app.gradle.kts app/build.gradle.kts
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Editx-AI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
